name: Build and Release Windows App

on:
  push:
    tags:
      - 'v*' # Startet automatisch bei Tags wie v1.0.0, v1.0.1 etc.

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Code aus dem Repository auschecken
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 3. Abhängigkeiten installieren
      - name: Install Dependencies
        run: npm ci

      # 4. Windows App mit Electron Forge bauen & auf GitHub veröffentlichen
      - name: Build & Publish Release
        run: npm run publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}